<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Responsive Image Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="gallery.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1 class="h2 mb-3">Responsive Image Gallery</h1>
    <p class="fw-semibold mb-4">Resize the browser window to see the effect.</p>
    <div class="row g-3">
        <div class="col-12 col-sm-6 col-lg-3"><figure class="gallery h-100 mb-0"><a href="https://demo.codegym.vn/web/15/gallery/img_fjords.jpg" target="_blank" rel="noopener noreferrer"><img class="img-fluid w-100" src="https://demo.codegym.vn/web/15/gallery/img_fjords.jpg" alt="Trolltunga Norway" width="600" height="400"></a><figcaption class="text-center p-3">Add a description of the image here</figcaption></figure></div>
        <div class="col-12 col-sm-6 col-lg-3"><figure class="gallery h-100 mb-0"><a href="https://demo.codegym.vn/web/15/gallery/img_forest.jpg" target="_blank" rel="noopener noreferrer"><img class="img-fluid w-100" src="https://demo.codegym.vn/web/15/gallery/img_forest.jpg" alt="Forest" width="600" height="400"></a><figcaption class="text-center p-3">Add a description of the image here</figcaption></figure></div>
        <div class="col-12 col-sm-6 col-lg-3"><figure class="gallery h-100 mb-0"><a href="https://demo.codegym.vn/web/15/gallery/img_lights.jpg" target="_blank" rel="noopener noreferrer"><img class="img-fluid w-100" src="https://demo.codegym.vn/web/15/gallery/img_lights.jpg" alt="Northern Lights" width="600" height="400"></a><figcaption class="text-center p-3">Add a description of the image here</figcaption></figure></div>
        <div class="col-12 col-sm-6 col-lg-3"><figure class="gallery h-100 mb-0"><a href="https://demo.codegym.vn/web/15/gallery/img_mountains.jpg" target="_blank" rel="noopener noreferrer"><img class="img-fluid w-100" src="https://demo.codegym.vn/web/15/gallery/img_mountains.jpg" alt="Mountains" width="600" height="400"></a><figcaption class="text-center p-3">Add a description of the image here</figcaption></figure></div>
    </div>
    <p class="mt-4">This gallery uses the Bootstrap grid: four images per row on large screens, two images per row on medium screens, and one image per row on small screens. Click an image to view it in a new tab.</p>
</main>
</body>
</html>
